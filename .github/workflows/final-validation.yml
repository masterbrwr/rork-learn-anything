name: Final validated Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate pivot source
        shell: bash
        run: |
          test -f android-learn-anything/app/src/main/java/com/rork/learnanything/data/Ai.kt
          test -f android-learn-anything/app/src/main/java/com/rork/learnanything/ui/screens/GoalIntakeScreen.kt
          test -f android-learn-anything/app/src/main/java/com/rork/learnanything/ui/screens/HomeScreen.kt
          ! grep -Fq '): CourseDraft = = try {' android-learn-anything/app/src/main/java/com/rork/learnanything/data/Ai.kt
          grep -Fq 'outcome-driven roadmap' android-learn-anything/app/src/main/java/com/rork/learnanything/data/Ai.kt
          grep -Fq 'What do you want to be able to do?' android-learn-anything/app/src/main/java/com/rork/learnanything/ui/screens/HomeScreen.kt

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        working-directory: android-learn-anything
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          cat > app/src/main/java/com/rork/learnanything/Config.kt <<EOF
          package com.rork.learnanything
          object Config {
              const val EXPO_PUBLIC_SUPABASE_URL: String = "$SUPABASE_URL"
              const val EXPO_PUBLIC_SUPABASE_ANON_KEY: String = "$SUPABASE_ANON_KEY"
              const val EXPO_PUBLIC_TOOLKIT_URL: String = ""
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, lint, and assemble
        working-directory: android-learn-anything
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug lintDebug

      - name: Validate APK
        shell: bash
        run: |
          APK=$(find android-learn-anything/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: learn-anything-final-validated-apk
          path: android-learn-anything/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

