name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Learn Anything APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply multilingual and evidence-informed learning support
        shell: python
        run: |
          from pathlib import Path
          root = Path('android-learn-anything/app/src/main/java/com/rork/learnanything')

          models = root / 'data/Models.kt'
          text = models.read_text()
          old = '    val learningStyle: String = "Examples",\n    val onboarded: Boolean = false,'
          new = '    val learningStyle: String = "Examples",\n    /** Preferred language for lessons, tutor replies, quizzes, visuals, and course generation. */\n    val language: String = "English",\n    val onboarded: Boolean = false,'
          if old in text and 'val language: String = "English"' not in text:
              models.write_text(text.replace(old, new, 1))

          ai = root / 'data/Ai.kt'
          text = ai.read_text()
          old = '                val raw = complete("$system\\nRespond with ONLY a single valid JSON object. No markdown, no commentary.", listOf("user" to user), maxTokens, 0.5)'
          new = '                val language = AppStore.state.value.profile.language.ifBlank { "English" }\n                val localizedSystem = "$system\\n${LearningEngine.GUIDANCE}\\nLANGUAGE RULE: Teach and respond entirely in the learner\'s preferred language: $language. Translate lesson titles, explanations, examples, questions, answer choices, feedback, memory tricks, visual labels/captions, and course content into that language. Keep technical product names, formulas, code, units, and official terminology unchanged when translating them would reduce accuracy. Do not switch back to English unless the learner asks.\\nRespond with ONLY a single valid JSON object. No markdown, no commentary."\n                val raw = complete(localizedSystem, listOf("user" to user), maxTokens, 0.5)'
          if old in text and 'LearningEngine.GUIDANCE' not in text:
              ai.write_text(text.replace(old, new, 1))

          # Make path creation resilient: if the AI backend is temporarily unavailable,
          # generate a clearly labeled starter curriculum locally instead of trapping the
          # learner on an error screen. The real AI path is still attempted first.
          import re
          text = ai.read_text()
          pattern = r'(    suspend fun generateCourse\(goal: String, level: String, deadline: String, minutesPerDay: Int, style: String, learner: String\): CourseDraft =)\n        structured\('
          replacement = r'''\1 = try {\n        structured('''
          text, n = re.subn(pattern, replacement, text, count=1)
          if n:
              marker = '            CourseDraft.serializer(), 2500,\n        )\n\n    suspend fun generateLesson'
              fallback = '''            CourseDraft.serializer(), 2500,\n        )\n    } catch (e: Exception) {\n        val subject = goal.trim().split(" ").firstOrNull()?.replaceFirstChar { it.uppercase() } ?: "General"\n        val pace = minutesPerDay.coerceIn(10, 60)\n        CourseDraft(\n            title = "Getting Started: $goal",\n            subject = subject,\n            overview = "A starter path built from the fundamentals so you can begin learning while the AI service reconnects.",\n            level = level,\n            objectives = listOf("Understand the essential foundations", "Practice the core ideas", "Apply what you learned to a simple real-world task"),\n            prerequisites = emptyList(),\n            nextSteps = listOf("Build on the fundamentals", "Practice with harder examples"),\n            foundationGap = "Start with the fundamentals before moving into more specific applications.",\n            modules = listOf(\n                DraftModule("Foundations", listOf(\n                    DraftLesson("What is $goal?", (pace * 0.20).toInt().coerceIn(5, 15)),\n                    DraftLesson("Key terms and core ideas", (pace * 0.25).toInt().coerceIn(5, 15)),\n                )),\n                DraftModule("Build the skill", listOf(\n                    DraftLesson("Worked example", (pace * 0.25).toInt().coerceIn(5, 15)),\n                    DraftLesson("Guided practice", (pace * 0.30).toInt().coerceIn(5, 15)),\n                )),\n            ),\n        )\n    }\n\n    suspend fun generateLesson'''
              if marker in text and 'A starter path built from the fundamentals' not in text:
                  text = text.replace(marker, fallback, 1)
              ai.write_text(text)

          intake = root / 'ui/screens/GoalIntakeScreen.kt'
          text = intake.read_text()
          if 'private val LANGUAGES = listOf(' not in text:
              text = text.replace(
                  'private val STYLES = listOf("Visual", "Examples", "Practice", "Theory")',
                  'private val STYLES = listOf("Visual", "Examples", "Practice", "Theory")\nprivate val LANGUAGES = listOf(\n    "English", "Spanish", "French", "German", "Portuguese", "Italian", "Chinese",\n    "Japanese", "Korean", "Arabic", "Hindi", "Russian", "Dutch", "Turkish"\n)'
              )
              text = text.replace(
                  '    var style by rememberSaveable { mutableStateOf(s.profile.learningStyle.takeIf { it in STYLES } ?: "Examples") }',
                  '    var style by rememberSaveable { mutableStateOf(s.profile.learningStyle.takeIf { it in STYLES } ?: "Examples") }\n    var language by rememberSaveable { mutableStateOf(s.profile.language.takeIf { it in LANGUAGES } ?: "English") }'
              )
              text = text.replace(
                  'AppStore.update { st -> st.copy(profile = st.profile.copy(learningStyle = style, dailyGoalMinutes = minutes)) }',
                  'AppStore.update { st -> st.copy(profile = st.profile.copy(learningStyle = style, dailyGoalMinutes = minutes, language = language)) }'
              )
              text = text.replace(
                  '                                ChipQuestion("How you prefer to learn", STYLES, style) { style = it }',
                  '                                ChipQuestion("How you prefer to learn", STYLES, style) { style = it }\n                                ChipQuestion("Learning language", LANGUAGES, language) { language = it }'
              )
              intake.write_text(text)

      - name: Commit learning-system changes
        if: ${{ !contains(github.event.head_commit.message, '[learning-engine]') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-learn-anything/app/src/main/java/com/rork/learnanything/data/Models.kt \
                  android-learn-anything/app/src/main/java/com/rork/learnanything/data/Ai.kt \
                  android-learn-anything/app/src/main/java/com/rork/learnanything/data/LearningEngine.kt \
                  android-learn-anything/app/src/main/java/com/rork/learnanything/ui/screens/GoalIntakeScreen.kt
          if git diff --cached --quiet; then
            echo "Learning system already applied."
          else
            git commit -m "Upgrade learning engine with evidence-informed methods [learning-engine]"
            git push
          fi

      - name: Fix Compose imports for redesigned screens
        shell: python
        run: |
          from pathlib import Path

          root = Path('android-learn-anything/app/src/main/java/com/rork/learnanything')
          files = {
              root / 'ui/components/Chrome.kt': ('import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\n'),
              root / 'ui/screens/LessonScreen.kt': ('import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.unit.dp\n'),
          }
          for path, (old, new) in files.items():
              text = path.read_text()
              if 'import androidx.compose.ui.unit.dp' not in text:
                  if old not in text:
                      raise SystemExit(f'Missing expected Modifier import in {path}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          nav = root / 'ui/navigation/AppNavigation.kt'
          text = nav.read_text()
          text = text.replace('import androidx.compose.ui.clip\n', 'import androidx.compose.ui.draw.clip\n')
          text = text.replace('import androidx.compose.foundation.clip\n', '')
          if 'import androidx.compose.ui.draw.clip\n' not in text:
              marker = 'import androidx.compose.ui.Modifier\n'
              if marker not in text:
                  raise SystemExit('Missing expected Modifier import in AppNavigation.kt')
              text = text.replace(marker, marker + 'import androidx.compose.ui.draw.clip\n', 1)
          nav.write_text(text)

      - name: Configure Supabase app settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        working-directory: android-learn-anything
        run: |
          set +x
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repository secret" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY repository secret" && exit 1)
          cat > app/src/main/java/com/rork/learnanything/Config.kt <<EOF
          package com.rork.learnanything

          object Config {
              const val EXPO_PUBLIC_SUPABASE_URL: String = "$SUPABASE_URL"
              const val EXPO_PUBLIC_SUPABASE_ANON_KEY: String = "$SUPABASE_ANON_KEY"
              const val EXPO_PUBLIC_TOOLKIT_URL: String = ""
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-learn-anything
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: learn-anything-debug-apk
          path: android-learn-anything/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
